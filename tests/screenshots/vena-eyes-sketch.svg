<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <!-- Indigo iris glow -->
    <radialGradient id="irisGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>

    <!-- Iris gradient - dark charcoal with violet ring -->
    <radialGradient id="irisLeft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1c2e"/>
      <stop offset="35%" stop-color="#1c1c2e"/>
      <stop offset="55%" stop-color="#2a2a40"/>
      <stop offset="75%" stop-color="#4f46e5"/>
      <stop offset="85%" stop-color="#6366f1"/>
      <stop offset="95%" stop-color="#3a3a55"/>
      <stop offset="100%" stop-color="#1e1e32"/>
    </radialGradient>

    <radialGradient id="irisRight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1c2e"/>
      <stop offset="35%" stop-color="#1c1c2e"/>
      <stop offset="55%" stop-color="#2a2a40"/>
      <stop offset="75%" stop-color="#4f46e5"/>
      <stop offset="85%" stop-color="#6366f1"/>
      <stop offset="95%" stop-color="#3a3a55"/>
      <stop offset="100%" stop-color="#1e1e32"/>
    </radialGradient>

    <!-- Pupil depth -->
    <radialGradient id="pupil" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#0f0f17"/>
      <stop offset="80%" stop-color="#08080d"/>
      <stop offset="100%" stop-color="#08080d"/>
    </radialGradient>

    <!-- Catchlight -->
    <radialGradient id="catchlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e4e4ef" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e4e4ef" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle secondary catchlight -->
    <radialGradient id="catchlightSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Eye white gradient (sclera) -->
    <radialGradient id="scleraLeft" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#d4d4de"/>
      <stop offset="60%" stop-color="#b8b8c8"/>
      <stop offset="100%" stop-color="#8888a4"/>
    </radialGradient>

    <radialGradient id="scleraRight" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#d4d4de"/>
      <stop offset="60%" stop-color="#b8b8c8"/>
      <stop offset="100%" stop-color="#8888a4"/>
    </radialGradient>

    <!-- Background subtle vignette -->
    <radialGradient id="bgVignette" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0f0f17"/>
      <stop offset="100%" stop-color="#08080d"/>
    </radialGradient>

    <!-- Eyelash filter for softness -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="irisBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>

    <!-- Almond eye shape clips -->
    <clipPath id="eyeClipLeft">
      <ellipse cx="250" cy="200" rx="105" ry="52"/>
    </clipPath>

    <clipPath id="eyeClipRight">
      <ellipse cx="550" cy="200" rx="105" ry="52"/>
    </clipPath>

    <!-- Iris detail lines (like fiber striations) -->
    <pattern id="irisPattern" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="2" y1="0" x2="2" y2="4" stroke="#6366f1" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgVignette)"/>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#55556e" font-family="monospace" font-size="11" letter-spacing="4">V E N A — E Y E   S T U D Y</text>

  <!-- Subtle face shadow contour -->
  <ellipse cx="400" cy="210" rx="250" ry="140" fill="none" stroke="#1e1e32" stroke-width="0.5" opacity="0.3"/>

  <!-- ==================== LEFT EYE ==================== -->

  <!-- Outer glow -->
  <ellipse cx="250" cy="200" rx="115" ry="58" fill="url(#irisGlow)" opacity="0.15"/>

  <!-- Eye shape (sclera) -->
  <ellipse cx="250" cy="200" rx="105" ry="50" fill="url(#scleraLeft)" stroke="#1e1e32" stroke-width="1.5"/>

  <!-- Upper eyelid shadow -->
  <g clip-path="url(#eyeClipLeft)">
    <ellipse cx="250" cy="162" rx="110" ry="30" fill="#08080d" opacity="0.35"/>
  </g>

  <!-- Iris -->
  <circle cx="250" cy="202" r="34" fill="url(#irisLeft)" stroke="#1e1e32" stroke-width="0.8"/>

  <!-- Iris fiber texture -->
  <circle cx="250" cy="202" r="33" fill="url(#irisPattern)" opacity="0.4"/>

  <!-- Violet ring highlight -->
  <circle cx="250" cy="202" r="30" fill="none" stroke="#6366f1" stroke-width="1.2" opacity="0.35"/>
  <circle cx="250" cy="202" r="34" fill="none" stroke="#4f46e5" stroke-width="0.8" opacity="0.5"/>

  <!-- Pupil -->
  <circle cx="250" cy="202" r="14" fill="url(#pupil)"/>

  <!-- Catchlight - primary (upper right) -->
  <ellipse cx="240" cy="192" rx="6" ry="5" fill="url(#catchlight)"/>

  <!-- Catchlight - secondary (lower left, indigo tinted) -->
  <ellipse cx="258" cy="210" rx="3" ry="2.5" fill="url(#catchlightSoft)"/>

  <!-- Upper eyelid line -->
  <path d="M 148 205 Q 190 150 250 148 Q 310 150 352 205"
        fill="none" stroke="#08080d" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Lower eyelid line (subtle) -->
  <path d="M 155 205 Q 200 252 250 254 Q 300 252 345 205"
        fill="none" stroke="#1e1e32" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

  <!-- Upper lashes (left eye) -->
  <g stroke="#08080d" stroke-width="1.8" stroke-linecap="round" filter="url(#softGlow)">
    <line x1="155" y1="203" x2="145" y2="192"/>
    <line x1="170" y1="190" x2="158" y2="176"/>
    <line x1="188" y1="175" x2="177" y2="159"/>
    <line x1="210" y1="162" x2="202" y2="145"/>
    <line x1="230" y1="153" x2="226" y2="136"/>
    <line x1="250" y1="148" x2="250" y2="131"/>
    <line x1="270" y1="150" x2="273" y2="134"/>
    <line x1="290" y1="157" x2="296" y2="142"/>
    <line x1="310" y1="166" x2="319" y2="153"/>
    <line x1="328" y1="180" x2="339" y2="170"/>
    <line x1="345" y1="196" x2="354" y2="190"/>
  </g>

  <!-- Lower lashes (sparse, delicate) -->
  <g stroke="#1e1e32" stroke-width="1" stroke-linecap="round" opacity="0.5">
    <line x1="190" y1="242" x2="185" y2="250"/>
    <line x1="220" y1="250" x2="217" y2="260"/>
    <line x1="250" y1="254" x2="250" y2="264"/>
    <line x1="280" y1="250" x2="283" y2="260"/>
    <line x1="310" y1="242" x2="315" y2="250"/>
  </g>

  <!-- ==================== RIGHT EYE ==================== -->

  <!-- Outer glow -->
  <ellipse cx="550" cy="200" rx="115" ry="58" fill="url(#irisGlow)" opacity="0.15"/>

  <!-- Eye shape (sclera) -->
  <ellipse cx="550" cy="200" rx="105" ry="50" fill="url(#scleraRight)" stroke="#1e1e32" stroke-width="1.5"/>

  <!-- Upper eyelid shadow -->
  <g clip-path="url(#eyeClipRight)">
    <ellipse cx="550" cy="162" rx="110" ry="30" fill="#08080d" opacity="0.35"/>
  </g>

  <!-- Iris -->
  <circle cx="550" cy="202" r="34" fill="url(#irisRight)" stroke="#1e1e32" stroke-width="0.8"/>

  <!-- Iris fiber texture -->
  <circle cx="550" cy="202" r="33" fill="url(#irisPattern)" opacity="0.4"/>

  <!-- Violet ring highlight -->
  <circle cx="550" cy="202" r="30" fill="none" stroke="#6366f1" stroke-width="1.2" opacity="0.35"/>
  <circle cx="550" cy="202" r="34" fill="none" stroke="#4f46e5" stroke-width="0.8" opacity="0.5"/>

  <!-- Pupil -->
  <circle cx="550" cy="202" r="14" fill="url(#pupil)"/>

  <!-- Catchlight - primary (upper right) -->
  <ellipse cx="540" cy="192" rx="6" ry="5" fill="url(#catchlight)"/>

  <!-- Catchlight - secondary (lower left, indigo tinted) -->
  <ellipse cx="558" cy="210" rx="3" ry="2.5" fill="url(#catchlightSoft)"/>

  <!-- Upper eyelid line -->
  <path d="M 448 205 Q 490 150 550 148 Q 610 150 652 205"
        fill="none" stroke="#08080d" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Lower eyelid line (subtle) -->
  <path d="M 455 205 Q 500 252 550 254 Q 600 252 645 205"
        fill="none" stroke="#1e1e32" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

  <!-- Upper lashes (right eye) -->
  <g stroke="#08080d" stroke-width="1.8" stroke-linecap="round" filter="url(#softGlow)">
    <line x1="455" y1="196" x2="446" y2="190"/>
    <line x1="472" y1="180" x2="461" y2="170"/>
    <line x1="490" y1="166" x2="481" y2="153"/>
    <line x1="510" y1="157" x2="504" y2="142"/>
    <line x1="530" y1="150" x2="527" y2="134"/>
    <line x1="550" y1="148" x2="550" y2="131"/>
    <line x1="570" y1="153" x2="574" y2="136"/>
    <line x1="590" y1="162" x2="598" y2="145"/>
    <line x1="612" y1="175" x2="623" y2="159"/>
    <line x1="630" y1="190" x2="642" y2="176"/>
    <line x1="645" y1="203" x2="655" y2="192"/>
  </g>

  <!-- Lower lashes (sparse, delicate) -->
  <g stroke="#1e1e32" stroke-width="1" stroke-linecap="round" opacity="0.5">
    <line x1="490" y1="242" x2="485" y2="250"/>
    <line x1="520" y1="250" x2="517" y2="260"/>
    <line x1="550" y1="254" x2="550" y2="264"/>
    <line x1="580" y1="250" x2="583" y2="260"/>
    <line x1="610" y1="242" x2="615" y2="250"/>
  </g>

  <!-- ==================== BRIDGE SHADOW ==================== -->
  <ellipse cx="400" cy="210" rx="30" ry="50" fill="#08080d" opacity="0.08"/>

  <!-- ==================== BROW SUGGESTIONS ==================== -->
  <!-- Left brow - architectural, sharp -->
  <path d="M 160 160 Q 210 128 260 130 Q 310 132 348 148"
        fill="none" stroke="#1e1e32" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M 160 160 Q 210 130 260 132 Q 310 134 348 148"
        fill="none" stroke="#2a2a40" stroke-width="1" stroke-linecap="round" opacity="0.3"/>

  <!-- Right brow -->
  <path d="M 452 148 Q 490 132 540 130 Q 590 128 640 160"
        fill="none" stroke="#1e1e32" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M 452 148 Q 490 134 540 132 Q 590 130 640 160"
        fill="none" stroke="#2a2a40" stroke-width="1" stroke-linecap="round" opacity="0.3"/>

  <!-- ==================== ANNOTATIONS ==================== -->
  <!-- Color callouts -->
  <g font-family="monospace" font-size="9" fill="#55556e">
    <!-- Left annotations -->
    <line x1="216" y1="202" x2="100" y2="300" stroke="#1e1e32" stroke-width="0.5" stroke-dasharray="2,3"/>
    <text x="30" y="308">iris: #1c1c2e</text>
    <text x="30" y="320">charcoal depth</text>

    <line x1="250" y1="236" x2="150" y2="340" stroke="#1e1e32" stroke-width="0.5" stroke-dasharray="2,3"/>
    <text x="70" y="348" fill="#6366f1">ring: #6366f1</text>
    <text x="70" y="360">vena-accent violet</text>

    <!-- Right annotations -->
    <line x1="584" y1="202" x2="700" y2="300" stroke="#1e1e32" stroke-width="0.5" stroke-dasharray="2,3"/>
    <text x="650" y="308">pupil: #08080d</text>
    <text x="650" y="320">vena-bg void</text>

    <line x1="540" y1="192" x2="660" y2="340" stroke="#1e1e32" stroke-width="0.5" stroke-dasharray="2,3"/>
    <text x="600" y="348" fill="#e4e4ef">light: #e4e4ef</text>
    <text x="600" y="360">vena-text catch</text>
  </g>

  <!-- Signature -->
  <text x="400" y="390" text-anchor="middle" fill="#1e1e32" font-family="monospace" font-size="9" letter-spacing="2">nova / project vena / 2026</text>
</svg>